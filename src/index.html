<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lighthouse</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/mermaid.min.js"></script>
  <script src="highlight.js"></script>
  <script src="theme.js"></script>
  <script src="templates.js"></script>
  <script src="help.js"></script>
  <script src="editor.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img src="logo.svg" alt=""><span>Lighthouse</span></div>

    <div class="menu-wrap">
      <button class="btn" id="btn-new" title="New diagram (Ctrl+N)" aria-haspopup="menu">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>
        New
        <svg class="icon caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu-new" role="menu" hidden>
        <button data-template="class" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16"/></svg>
          Class diagram
        </button>
        <button data-template="sequence" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 3v18M18 3v18M6 8h12M18 14H6"/><path d="m15 5 3 3-3 3M9 11l-3 3 3 3"/></svg>
          Sequence diagram
        </button>
        <button data-template="usecase" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><path d="M5 8v5M2.5 10h5M5 13l-2 4M5 13l2 4"/><ellipse cx="17" cy="12" rx="5" ry="3"/><path d="M8.5 12h3.5"/></svg>
          Use case diagram
        </button>
        <button data-template="state" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="4" cy="12" r="1.5" fill="currentColor"/><rect x="8" y="9" width="7" height="6" rx="2"/><path d="M5.5 12H8M15 12h3"/><circle cx="20" cy="12" r="2"/></svg>
          State diagram
        </button>
        <button data-template="activity" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="3" r="1.5" fill="currentColor"/><path d="M12 4.5V7M12 13v2M7 15h10M9 15v2M15 15v2"/><path d="m12 7 3 3-3 3-3-3z"/><rect x="6" y="17" width="6" height="4" rx="1.5"/><rect x="13" y="17" width="5" height="4" rx="1.5"/></svg>
          Activity diagram
        </button>
      </div>
    </div>

    <button class="btn" id="btn-open" title="Open a Markdown file (Ctrl+O)">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open
    </button>
    <button class="btn" id="btn-save" title="Save as Markdown (Ctrl+S, Save as: Ctrl+Shift+S)">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></svg>
      Save .md
    </button>

    <div class="sep"></div>

    <div class="menu-wrap split">
      <button class="btn" id="btn-copy" title="Copy the Mermaid code (Ctrl+Shift+C)">
        <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        Copy
      </button>
      <button class="btn more" id="btn-copy-more" title="More copy options" aria-haspopup="menu">
        <svg class="icon caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu-copy" role="menu" hidden>
        <button data-copy="code" role="menuitem">Copy Mermaid code <span class="hint">Ctrl+Shift+C</span></button>
        <button data-copy="markdown" role="menuitem">Copy as Markdown block</button>
      </div>
    </div>

    <button class="btn primary" id="btn-png" title="Export the diagram as PNG (Ctrl+E)">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      Export PNG
    </button>

    <div class="spacer"></div>
    <div class="doc-name" title=""><span class="dot" id="dirty-dot" title="Unsaved changes" hidden></span><span id="doc-name">Untitled</span></div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane editor-pane">
      <div class="pane-head"><span>Mermaid</span><span class="badge" id="diagram-type"></span></div>
      <div class="editor">
        <div class="gutter" id="gutter"><div class="gutter-inner" id="gutter-inner"></div></div>
        <div class="code-area" id="code-area">
          <div class="line-mark" id="mark-current"></div>
          <div class="line-mark error" id="mark-error" hidden></div>
          <pre class="highlight" aria-hidden="true"><code id="highlight"></code></pre>
          <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" aria-label="Mermaid source"></textarea>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>

    <section class="pane preview-pane" id="preview-pane">
      <div class="pane-head tabs" role="tablist">
        <button class="tab active" id="tab-preview" role="tab" aria-selected="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview
        </button>
        <button class="tab" id="tab-help" role="tab" aria-selected="false" title="Help for the current diagram type (F1)">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"/></svg>
          Help
        </button>
      </div>
      <div class="viewport" id="viewport">
        <div class="stage" id="stage"></div>
        <div class="empty" id="empty" hidden>Start typing a Mermaid diagram on the left.</div>
      </div>
      <div class="help" id="help" role="tabpanel"></div>
      <div class="error-banner" id="error-banner" hidden>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
        <pre id="error-text"></pre>
      </div>
      <div class="zoom" id="zoom">
        <button id="zoom-out" title="Zoom out (Ctrl+-)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
        <button id="zoom-reset" title="Actual size (Ctrl+1)">100%</button>
        <button id="zoom-in" title="Zoom in (Ctrl++)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="zoom-fit" class="fit" title="Fit to view (Ctrl+0, double-click the preview)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
        </button>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="status busy" id="status">Loading</span>
    <span class="spacer"></span>
    <span id="cursor">Ln 1, Col 1</span>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>

# Lighthouse configuration
#
# Location: Linux   ~/.config/lighthouse/config.toml ($XDG_CONFIG_HOME/lighthouse/config.toml)
#           Windows %APPDATA%\Lighthouse\config.toml
# Every key is optional: missing keys fall back to the built-in defaults shown here.
# Colors accept any CSS color (#RRGGBB, #RRGGBBAA, rgb(), hsl(), named colors).
# Press Ctrl+R in Lighthouse to reload this file without restarting.

# ---------------------------------------------------------------------------
# Application interface
# ---------------------------------------------------------------------------
[ui]
font_family = "'Inter', 'Segoe UI', 'Cantarell', 'Noto Sans', 'Ubuntu', 'DejaVu Sans', sans-serif"
font_size = 13                  # px
background = "#FFFFFF"          # window, toolbar and panels
border = "#E2E6EE"              # separators and outlines
text = "#0F172A"
text_muted = "#5A6478"
hover = "#EEF4FF"               # button hover background
accent = "#0A66FF"              # primary buttons, focus rings, links
accent_hover = "#0050D8"
accent_text = "#FFFFFF"         # text on accent background
success = "#00B35A"
error = "#FF1744"
radius = 8                      # px, corner radius of buttons and menus

# ---------------------------------------------------------------------------
# Text editor
# ---------------------------------------------------------------------------
[editor]
font_family = "'JetBrains Mono', 'Cascadia Mono', 'Fira Code', 'Source Code Pro', 'Consolas', 'Ubuntu Mono', 'DejaVu Sans Mono', monospace"
font_size = 14                  # px
line_height = 1.6
tab_size = 4                    # spaces inserted by the Tab key
render_delay_ms = 250           # pause after typing before the preview refreshes
background = "#FFFFFF"
text = "#1E293B"
gutter_text = "#A0A9BA"         # line numbers
current_line = "#F3F7FF"
selection = "#C7DCFF"
error_line = "#FFE5EA"

# Syntax colors of the Mermaid code
[editor.syntax]
diagram = "#D500F9"             # classDiagram, sequenceDiagram...
keyword = "#0A66FF"             # class, participant, loop, note, end...
arrow = "#FF1744"               # -->, ->>, <|--, *--...
string = "#00A152"              # "quoted text"
label = "#FF6D00"               # text after ':' (messages, relation labels)
member = "#00838F"              # class attributes and methods
comment = "#98A2B3"             # %% comments
punctuation = "#7C8799"         # { } ( ) < > ~

# ---------------------------------------------------------------------------
# Diagram preview
# ---------------------------------------------------------------------------
[preview]
background = "#FFFFFF"
grid = true                     # dotted grid behind the diagram
grid_color = "#DCE3EF"
max_auto_zoom = 1.5             # "fit" never enlarges small diagrams beyond this factor

# ---------------------------------------------------------------------------
# Diagram colors (applied to every Mermaid diagram type)
# ---------------------------------------------------------------------------
[diagram]
font_family = "'Inter', 'Segoe UI', 'Noto Sans', 'Ubuntu', 'DejaVu Sans', sans-serif"
font_size = 15                  # px
look = "classic"                # "classic", "neo" or "handDrawn"
text = "#0F172A"                # generic text
line = "#1E293B"                # relations, transitions, edges, fork/join bars
edge_label_background = "#FFFFFF"
terminal = "#0F172A"            # start and end points (states, activities)
lifeline = "#8592AA"            # sequence lifelines
message = "#1E293B"             # sequence message arrows
message_text = "#1E293B"
sequence_number = "#FFFFFF"     # autonumber digits
include_line = "#00B35A"        # use case <<include>> relations
extend_line = "#FF7A00"         # use case <<extend>> relations
secondary = "#FFE3EC"           # used by other Mermaid diagram types (ER, mind map...)
tertiary = "#E2FFF1"

# One color per item type. Within a diagram, every item type has its own color.
#
#               class      sequence      use case   state       activity
#   element     class      participant   use case   state       action
#   interface   <<interface>>
#   abstract    <<abstract>>
#   enumeration <<enumeration>>
#   actor                  actor         actor
#   note        note       note          note       note
#   activation             activation
#   decision                                        <<choice>>  diamond
#   container   namespace  loop/alt...   boundary   composite   subgraph

[diagram.element]
fill = "#E8F1FF"
border = "#0A66FF"
text = "#0B1A3A"

[diagram.interface]
fill = "#FFE3F1"
border = "#E6007A"
text = "#4A0027"

[diagram.abstract]
fill = "#DFFFEF"
border = "#00B35A"
text = "#00361C"

[diagram.enumeration]
fill = "#FFF0DE"
border = "#FF7A00"
text = "#3D1D00"

[diagram.actor]
fill = "#DDF9FF"
border = "#00A3C4"
text = "#0F172A"

[diagram.note]
fill = "#FFF4B8"
border = "#FFB300"
text = "#3B2A00"

[diagram.activation]
fill = "#DFFFEF"
border = "#00B35A"
text = "#00361C"

[diagram.decision]
fill = "#FFF0DE"
border = "#FF7A00"
text = "#3D1D00"

[diagram.container]
fill = "#FFFFFF"                # body
header = "#F3E5FF"              # title / label box
border = "#8B00FF"
text = "#5A00A8"

# Raw Mermaid theme variables, applied last. Any variable of Mermaid's "base"
# theme can be set here, see https://mermaid.js.org/config/theming.html
[diagram.overrides]
# noteBkgColor = "#FFF4B8"

# ---------------------------------------------------------------------------
# PNG export
# ---------------------------------------------------------------------------
[export]
png_scale = 2.0                 # pixel density multiplier
png_padding = 32                # px around the diagram
png_background = "#FFFFFF"      # set to "transparent" for a transparent image
